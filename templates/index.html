<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Language Model UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 5px; padding: 10px; }
        textarea { width: 100%; height: 200px; margin: 10px 0; }
        .output { background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>NLP Language Model UI</h1>
    
    <div>
        <button id="trainBtn">Train Models</button>
        <button id="showCorpusBtn">Show Corpus</button>
        <button id="clearBtn">Clear Output</button>
        <span id="status">{{ status }}</span>
    </div>
    
    <div>
        <button id="genBtn1">Generate Text LM1</button>
        <button id="genBtn2">Generate Text LM2</button>
    </div>
    
    <div>
        <input type="text" id="perplexInput" placeholder="Enter text for perplexity calculation" style="width: 70%;">
        <button id="calcBtn">Calculate Perplexity</button>
    </div>
    
    <div class="output" id="output"></div>
    
    <script>
        const statusSpan = document.getElementById('status');
        const outputDiv = document.getElementById('output');
        
        document.getElementById('trainBtn').addEventListener('click', () => {
            console.log('Train button clicked');
            fetch('/train', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log('Train response:', data);
                    outputDiv.innerHTML += '<p>' + data.status + '</p>';
                    checkStatus();
                })
                .catch(error => console.error('Train error:', error));
        });
        
        function checkStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    statusSpan.textContent = data.status;
                    if (data.status.includes('progress') || data.status.includes('Training')) {
                        setTimeout(checkStatus, 1000);
                    }
                });
        }
        
        document.getElementById('genBtn1').addEventListener('click', () => {
            fetch('/generate/1')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        outputDiv.innerHTML += '<p>Error: ' + data.error + '</p>';
                    } else {
                        outputDiv.innerHTML += '<p><strong>Generated Text LM1:</strong><br>' + data.text + '</p>';
                    }
                });
        });
        
        document.getElementById('genBtn2').addEventListener('click', () => {
            fetch('/generate/2')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        outputDiv.innerHTML += '<p>Error: ' + data.error + '</p>';
                    } else {
                        outputDiv.innerHTML += '<p><strong>Generated Text LM2:</strong><br>' + data.text + '</p>';
                    }
                });
        });
        
        document.getElementById('showCorpusBtn').addEventListener('click', () => {
            fetch('/corpus')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        outputDiv.innerHTML += '<p>Error: ' + data.error + '</p>';
                    } else {
                        outputDiv.innerHTML += '<p><strong>Corpus Text:</strong><br><pre>' + data.text + '</pre></p>';
                    }
                });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            outputDiv.innerHTML = '';
        });

        document.getElementById('calcBtn').addEventListener('click', () => {
            console.log('Calculate button clicked');
            const text = document.getElementById('perplexInput').value;
            fetch('/perplexity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Perplexity response:', data);
                if (data.error) {
                    outputDiv.innerHTML += '<p>Error: ' + data.error + '</p>';
                } else {
                    outputDiv.innerHTML += '<p><strong>Input:</strong> ' + text + '</p>';
                    outputDiv.innerHTML += '<p>Perplexity LM1: ' + data.perp1.toFixed(2) + '</p>';
                    outputDiv.innerHTML += '<p>Perplexity LM2: ' + data.perp2.toFixed(2) + '</p>';
                }
            })
            .catch(error => console.error('Perplexity error:', error));
        });
    </script>
</body>
</html>
